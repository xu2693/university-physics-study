<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
<title id="title">两条生产线的次品概率</title><desc id="desc">甲线占六成，次品率百分之二；乙线占四成，次品率百分之五。两条次品路径相加为百分之三点二。</desc>
<rect width="400" height="320" rx="14" fill="#f0f7fb"/><g font-family="Microsoft YaHei, sans-serif" fill="#173f63">
<text x="24" y="36" font-size="20" font-weight="bold">按来源计算次品概率</text>
<rect x="20" y="56" width="360" height="78" rx="9" fill="#fff"/><text x="34" y="88" font-size="18">甲线 60% × 次品率 2%</text><text x="34" y="119" font-size="18" fill="#145e96">= 0.6 × 0.02 = 0.012</text>
<rect x="20" y="145" width="360" height="78" rx="9" fill="#fff"/><text x="34" y="177" font-size="18">乙线 40% × 次品率 5%</text><text x="34" y="208" font-size="18" fill="#145e96">= 0.4 × 0.05 = 0.020</text>
<text x="24" y="264" font-size="18" font-weight="bold">全部次品：两条路径相加</text><text x="24" y="295" font-size="18">0.012 + 0.020 = 0.032</text>
</g></svg>
